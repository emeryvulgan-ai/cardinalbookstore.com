<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardinal Bookstore - Cart/Checkout</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <h1>Cardinal Bookstore</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="cart.html">Cart/Checkout</a></li>
        <li><a href="contact.html">Contact/About</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section>
      <h2>Your Cart</h2>
      <table>
        <thead>
          <tr>
            <th>Book</th>
            <th>Quantity</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Book Title 1</td>
            <td>1</td>
            <td>$19.99</td>
          </tr>
        </tbody>
      </table>
      <p><strong>Total:</strong> $19.99</p>
      <form>
        <h3>Checkout</h3>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <button type="submit">Place Order</button>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 Cardinal Bookstore | <a href="contact.html">Contact Us</a></p>
  </footer>
</body>
</html>
